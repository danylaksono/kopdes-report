<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Peta interaktif · Koperasi Desa Merah Putih</title>
  <meta name="description"
    content="Peta multivariat 83.379 Koperasi Desa Merah Putih: dari kisi dinamis sampai agregat kecamatan, kabupaten dan provinsi." />
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="../app/site.css" rel="stylesheet" />
  <link href="../app/explore.css" rel="stylesheet" />
  <!-- duckdb-wasm imports apache-arrow as a bare specifier; the import map
       resolves it so no bundler is needed (no-build-step site). -->
  <script type="importmap">
    {
      "imports": {
        "@duckdb/duckdb-wasm": "https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.29.0/dist/duckdb-browser.mjs",
        "apache-arrow": "https://cdn.jsdelivr.net/npm/apache-arrow@17.0.0/+esm"
      }
    }
  </script>
</head>

<body class="explore-body" data-root="../">
  <nav id="site-nav"></nav>

  <div class="explore-shell">
    <aside class="rail" id="rail" aria-label="Kontrol peta"></aside>

    <div class="map-wrap">
      <div id="map"></div>
      <!-- View-level controls sit over the canvas; the rail is for the data. -->
      <div id="search" class="map-control map-control-search"></div>
      <div id="basemaps" class="map-control map-control-basemaps"></div>
      <div id="status">Menyiapkan peta…</div>
      <div id="tip" role="status" aria-live="polite"></div>
      <aside id="inspector" hidden aria-label="Rincian wilayah"></aside>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script type="module" src="../app/site.js"></script>
  <script type="module" src="../app/explore/index.js"></script>
</body>

</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kopdes Merah Putih — visual analytics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="app/style.css" rel="stylesheet" />
</head>
<body>
  <div id="map"></div>

  <div id="info" class="panel">
    <h1 id="info-text">Loading&hellip;</h1>
    <div class="count" id="info-count"></div>
  </div>

  <div id="controls" class="panel">
    <fieldset>
      <legend>View</legend>
      <label class="opt"><input type="radio" name="view" value="grid" /> Screen grid</label>
      <label class="opt"><input type="radio" name="view" value="hex" /> Screen hex</label>
      <label class="opt"><input type="radio" name="view" value="points" /> Points (clustered)</label>
    </fieldset>
    <fieldset id="cell-size-field">
      <legend>Cell size <span class="val" id="cell-size-val"></span></legend>
      <input type="range" id="cell-size" min="16" max="120" step="4"
             aria-label="Aggregation cell size in pixels" />
    </fieldset>
  </div>

  <div id="legend" class="panel"></div>
  <div id="cell-tip"></div>

  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script type="module" src="app/main.js"></script>
</body>
</html>

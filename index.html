<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kopdes Merah Putih - Locations</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body, #map { height: 100%; margin: 0; }
    body { font-family: system-ui, sans-serif; }

    #info {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.92);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
      z-index: 1;
    }

    .maplibregl-popup-content {
      font-size: 13px;
      line-height: 1.4;
    }
    .maplibregl-popup-content b { font-size: 14px; }

    #legend {
      position: absolute;
      bottom: 24px;
      left: 12px;
      background: rgba(255, 255, 255, 0.92);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
      z-index: 1;
    }
    #legend .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    #legend .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="info">Kopdes Merah Putih cooperatives &mdash; loading&hellip;</div>
  <div id="legend">
    <div class="row"><span class="dot" style="background:#2e9e5b"></span> Verified</div>
    <div class="row"><span class="dot" style="background:#e0a13d"></span> Not verified</div>
    <div class="row"><span class="dot" style="background:#9aa0a6"></span> No asset record</div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script src="main.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="Inter, system-ui, sans-serif">
  <defs>
    <path id="hex" d="M 0,-70 L 60.62,-35 L 60.62,35 L 0,70 L -60.62,35 L -60.62,-35 Z"/>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c5c5c"/>
    </marker>
  </defs>

  <!-- the six neighbouring cells -->
  <g fill="#f1eee7" stroke="#d8d3c7" stroke-width="1.5">
    <use href="#hex" transform="translate(421,180)"/>
    <use href="#hex" transform="translate(179,180)"/>
    <use href="#hex" transform="translate(361,75)"/>
    <use href="#hex" transform="translate(239,75)"/>
    <use href="#hex" transform="translate(361,285)"/>
    <use href="#hex" transform="translate(239,285)"/>
  </g>

  <!-- the cell that holds the cooperative -->
  <use href="#hex" transform="translate(300,180)" fill="#f9e9e6" stroke="#a00" stroke-width="2"/>

  <!-- the ±400 m measure, across the top-right cell -->
  <line x1="300" y1="75" x2="421" y2="75" stroke="#5c5c5c" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="360" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">±400 m</text>

  <!-- the cooperative -->
  <circle cx="300" cy="180" r="8" fill="#a00" stroke="#fff" stroke-width="2"/>
  <text x="300" y="212" text-anchor="middle" font-size="12" fill="#5c5c5c">koperasi</text>

  <!-- legend -->
  <text x="40" y="318" font-size="13" fill="#1a1a1a">Satu petak heksagonal ± 400 m sisi ke sisi.</text>
  <text x="40" y="338" font-size="13" fill="#5c5c5c">Populasi dihitung per petak. Petak kosong = “tanpa penduduk tercatat”.</text>
</svg>
